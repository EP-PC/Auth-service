apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth
  template:
    metadata:
      labels:
        app: auth
    spec:
      containers:
          - name: auth
            image: pedrohmm1/auth:1b67b55
            imagePullPolicy: Always
            ports:
              - containerPort: 8080
            resources:
              requests:
                memory: "256Mi"
                cpu: "250m"
              limits:
                memory: "512Mi"
                cpu: "500m"
            env:

              # chave HMAC do JWT (Secret criado fora do Git, ver README).
              # Sem default: sem ela o servico nao sobe.
              - name: JWT_SECRET_KEY
                valueFrom:
                  secretKeyRef:
                    name: auth-secrets
                    key: JWT_SECRET_KEY

              # o gateway no EKS e acessado por HTTP puro (http://<lb>.elb.amazonaws.com:8080,
              # sem dominio/HTTPS): com Secure o navegador/curl descartam o cookie.
              # false -> sem Secure e SameSite=Lax. O JWT trafega em claro: paliativo;
              # com dominio + ACM + HTTPS no Load Balancer, voltar para "true"
              - name: JWT_COOKIE_SECURE
                value: "false"

              # heap de ate 50% do limite (256 MB de 512Mi); sobra para metaspace/threads
              - name: JAVA_TOOL_OPTIONS
                value: "-XX:MaxRAMPercentage=50"

---

apiVersion: v1
kind: Service
metadata:
  name: auth
spec:
  selector:
    app: auth
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
  type: ClusterIP
