# Exemplo do Secret do auth (SEM valores reais; nao aplicar como esta).
# O Secret real e criado so com a JWT_SECRET_KEY do .env local (que nao vai
# para o Git). NAO use --from-env-file=.env: o .env tambem tem
# ACCOUNT_ADMIN_EMAIL/HASH, que sao do compose local, nao do auth.
#   kubectl create secret generic auth-secrets \
#     --from-literal=JWT_SECRET_KEY="$(grep '^JWT_SECRET_KEY=' .env | cut -d= -f2- | tr -d '\r')"
apiVersion: v1
kind: Secret
metadata:
  name: auth-secrets
type: Opaque
stringData:
  JWT_SECRET_KEY: ""
